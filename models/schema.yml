          - unique: 
              column_name: "(date_date||'-'||campaign_key)"
          - not_null: 
              column_name: "(date_date||'-'||campaign_key)"
        columns:
          - name: date_date
            description: date of the campaign and its cost 
          - name: paid_source
            description: source of the campaign
          - name: campaign_key
            description: key of the campaign 
          - name: campaign_name 
            description: name of the campaign 
          - name: ads_cost
            description: campaing ads costs
          - name: impression
